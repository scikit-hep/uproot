codecov:
  require_ci_to_pass: true
  notify:
    # Coverage is uploaded by two jobs (CPU and CUDA); wait for both before
    # reporting, so that a partial report is never posted
    after_n_builds: 2

comment:
  layout: files
  after_n_builds: 2

coverage:
  status:
    # Every reachable line and branch must be tested. Mark what can't be reached
    # with "# pragma: no cover  (reason)" or "# pragma: no branch  (reason)".
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

github_checks:
  annotations: false
