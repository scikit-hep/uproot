[build-system]
build-backend = "hatchling.build"
requires = [
  "hatchling",
  "hatch-vcs"
]

[dependency-groups]
dev = [
  { include-group = "extra" },
  { include-group = "test" }
]
extra = [
  "boost_histogram>=0.13",
  "dask-awkward>=2025.5.0",
  "dask[array,distributed]",
  "hist>=1.2",
  "pandas",
  "awkward-pandas"
]
test = [
  "aiohttp",
  "deflate",
  "graphed[awkward,parquet]>=0.0.9; python_version >= '3.11'",
  "graphed-executors>=0.0.3; python_version >= '3.11'",
  "isal",
  "moto[s3,server]",
  "paramiko",
  "pytest-cov",
  "pytest-rerunfailures",
  "pytest-xdist",
  "s3fs>=2023.1.0",
  "vector; python_version >= '3.11'",
  { include-group = "test-core" }
]
test-core = [
  "pytest-timeout",
  "pytest>=6",
  "rangehttpserver",
  "requests",
  "scikit-hep-testdata>=0.6.9"
]
test-gpu-cu12 = [
  "kvikio-cu12",
  "nvidia-nvcomp-cu12",
  { include-group = "test-core" }
]
test-gpu-cu13 = [
  "kvikio-cu13",
  "nvidia-nvcomp-cu13",
  { include-group = "test-core" }
]
test-pyodide = [
  "pytest-pyodide; python_version >='3.11'",
  { include-group = "test-core" }
]
test-xrootd = [
  "fsspec-xrootd>=0.5.0",
  { include-group = "test-core" }
]

[project]
authors = [
  { name = "Jim Pivarski", email = "jpivarski@gmail.com" }
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Software Development",
  "Topic :: Utilities"
]
dependencies = [
  "awkward>=2.8.2",
  "cramjam>=2.5.0",
  "xxhash",
  "numpy",
  "fsspec!=2026.2.0",
  "packaging"
]
description = "ROOT I/O in pure Python and NumPy."
dynamic = [
  "version"
]
license = "BSD-3-Clause"
name = "uproot"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
gds-cu12 = [
  "kvikio-cu12",
  "nvidia-nvcomp-cu12"
]
gds-cu13 = [
  "kvikio-cu13",
  "nvidia-nvcomp-cu13"
]
http = ["aiohttp"]
s3 = ["s3fs"]
xrootd = ["fsspec-xrootd>=0.5.0"]

[project.urls]
Download = "https://github.com/scikit-hep/uproot5/releases"
Homepage = "https://github.com/scikit-hep/uproot5"

[tool.hatch.build.hooks.vcs]
version-file = "src/uproot/version.py"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
filterwarnings = [
  "error",
  "default:module 'sre_.*' is deprecated:DeprecationWarning",
  "ignore:unclosed transport <asyncio.sslproto._SSLProtocolTransport",  # https://github.com/aio-libs/aiohttp/issues/1115
  "ignore:Implicitly cleaning up <HTTPError 405:ResourceWarning"  # Selenium leaves geckodriver's /shutdown response unclosed (Pyodide tests)
]
log_level = "INFO"
markers = [
  "slow",
  "network",
  "distributed",
  "xrootd"
]
minversion = "6.0"
testpaths = ["tests"]
timeout = 600
xfail_strict = true

[tool.repo-review]
ignore = ["PY004"]

[tool.ruff]
exclude = [
  "tests/*.py",
  "tests-cuda/*.py",
  "src/uproot/__init__.py",
  "docs-sphinx/*.py"
]

[tool.ruff.lint]
extend-select = [
  "B",  # flake8-bugbear
  "I",  # isort
  # "ARG", # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "FURB132",  # use set.discard instead of check-and-remove
  "FURB163",  # use math.log10/log2 instead of math.log with a redundant base
  "ISC",  # flake8-implicit-str-concat
  "PERF102",  # don't use dict.items() when only the keys are used
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PYI025",  # alias collections.abc.Set to avoid confusion with the set builtin
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "UP",  # pyupgrade
  "YTT"  # flake8-2020
]
ignore = [
  "PGH003",  # too-broad type ignore
  "PLC0415",  # imports outside top level
  "PLC1901",  # empty string is falsey (but I don't want to rely on such weak typing)
  "PLR",
  "PLW0120",  # else on loop without break
  "PLW1641",  # __eq__ without __hash__
  "RUF012",  # enforces type annotations on a codebase that lacks type annotations
  "S307",  # no eval allowed
  "SIM103",  # interferes with my if-elif-elif-else blocks
  "SIM114",  # combine `if` branches using logical `or` operator
  "SIM118"  # key in dict, broken since uproot doesn't behave like a dict
]
isort.required-imports = ["from __future__ import annotations"]
# Ruff 0.16 greatly expanded the implicit default rule set; pin it to the previous
# default so that the rules we opt into are the ones listed in extend-select above.
# Deliberately not adopted from the 0.16 defaults:
# BLE001/S110: broad excepts are intentional around optional imports and best-effort deserialization
# DTZ: ROOT stores naive local-time datetimes, so tz-aware ones would be wrong
# N999: would require renaming the tests-wasm and tests-cuda directories
# S102: exec is how models are generated from TStreamerInfo
# TRY002/TRY004: changing which exception types are raised is a user-visible change
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"dev/*" = ["T20", "T201"]
"src/uproot/*/file.py" = ["SIM115"]

[tool.setuptools_scm]
write_to = "src/uproot/_version.py"

[tool.uv]
exclude-newer = "7 days"
exclude-newer-package = { awkward = false, awkward-cpp = false, scikit-hep-testdata = false, graphed = false, graphed-executors = false }
