name: Deploy to PyPI

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build_dist:
    name: Build and upload sdist and wheel
    if: github.repository_owner == 'scikit-hep'
    uses: $/.github/workflows/build-distributions.yml

  publish:
    name: Publish to PyPI
    environment:
      name: pypi
    needs: [build_dist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    permissions:
      id-token: write # Required for trusted publishing to PyPI.
      attestations: write # Required to generate artifact attestations for the release artifacts.
      contents: read

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Packages
          path: dist

      - name: List distributions to be deployed
        run: ls -lha dist/

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/uproot-*

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
