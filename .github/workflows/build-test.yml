name: Test build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test on ${{ matrix.platform }} with Python ${{ matrix.python-version }}${{ matrix.root-version != '' && format(' and ROOT {0}', matrix.root-version) || '' }}${{ matrix.coverage && ' (coverage)' || '' }}${{ matrix.core-deps && ' and core test dependencies' || '' }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ['3.10', '3.14', 3.14 python-freethreading]
        root-version: ['']
        # On Linux, 3.10 and 3.14 only run in the ROOT jobs below, which run
        # the same tests plus the ones that need ROOT
        exclude:
          - platform: ubuntu-latest
            python-version: '3.10'
          - platform: ubuntu-latest
            python-version: '3.14'
        include:
          - platform: ubuntu-latest
            python-version: '3.10'
            root-version: '6.32'
          # Also runs the XRootD server tests, which no other job has the
          # server for, and measures coverage
          - platform: ubuntu-latest
            python-version: '3.14'
            root-version: latest
            coverage: true
          # Many optional and test dependencies don't have Python 3.15 wheels
          # yet, so only install the core test dependencies
          - platform: ubuntu-latest
            python-version: '3.15'
            core-deps: true

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    # Required for miniconda to activate conda
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: test-env
          init-shell: bash
          create-args: >-
            --strict-channel-priority
            conda-forge/label/python_rc::_python_rc
            python=${{ matrix.python-version }}
            ${{ matrix.root-version == 'latest' && 'root' || matrix.root-version == '6.32' && 'root=6.32.*' || '' }}
            ${{ matrix.coverage && 'xrootd' || '' }}
          micromamba-version: 2.6.0-0   # unpin when there is a release newer than 2.6.1-0

      - name: Set PYTHON_GIL=0 for free-threaded builds
        if: contains(matrix.python-version, 'python-freethreading')
        run: echo "PYTHON_GIL=0" >> $GITHUB_ENV

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check active Python version
        env:
          EXPECTED_PYTHON_VERSION: ${{ matrix.python-version }}
        run: python -c "import os, sys; actual = '.'.join(str(s) for s in sys.version_info[:2]); expected = os.environ['EXPECTED_PYTHON_VERSION'].split()[0]; assert actual == expected, f'{actual} incorrect!'"

      - name: Install sshd for fsspec ssh tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server
          sudo service ssh restart
          ssh-keygen -t rsa -N "" -f ~/.ssh/id_rsa
          cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
          chmod og-wx ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=no localhost echo "ssh connection successful"

      - name: Install XRootD
        if: runner.os != 'Windows' && !contains(matrix.python-version, 'python-freethreading') && !matrix.core-deps
        run: |
          uv pip install --group=test-xrootd

      - name: Pip install the package
        if: ${{ !matrix.core-deps }}
        run: uv pip install --system -e. --group=dev

      - name: Pip install the package with core test dependencies
        if: matrix.core-deps
        run: uv pip install --system -e. --group=test-core pytest-xdist pytest-rerunfailures

      - name: Run pytest
        if: ${{ !matrix.coverage }}
        run: |
          python -m pytest -vv -n auto tests --reruns 10 --reruns-delay 30 --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"

      - name: Run pytest and collect coverage
        if: matrix.coverage
        run: |
          python -m pytest -vv -n auto tests --reruns 10 --reruns-delay 30 --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"\
                           --cov=uproot --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage reports to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.coverage }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml

  numpy1-build:
    name: NumPy 1 test on ${{ matrix.platform }} with Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # NumPy 1's default integer is 32-bit on Windows, so that is the
        # platform that differs; macOS adds little on top of Linux
        platform: [windows-latest, ubuntu-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Pip install the package
        run: |
          uv venv
          # pyarrow 26 requires NumPy 2
          uv pip install -e. 'numpy<2' 'pyarrow<26' --group test

      - name: Run pytest
        run: |
          uv run --no-sync pytest -vv -n auto tests --reruns 10 --reruns-delay 30 --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"

  pyodide-build:
    name: Pyodide test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Pyodide's version tracks its CPython version (e.g. 314.x is Python
      # 3.14), and pyodide-py requires that same Python, so bump this when a
      # new Pyodide major comes out.
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Uproot is pure Python, so a regular wheel works in Pyodide. Its
      # dependencies (including awkward-cpp) are installed by micropip from
      # the Pyodide distribution or from the Pyodide wheels on PyPI.
      - name: Build the package
        run: uv build --wheel --out-dir dist

      - name: Install dependencies
        run: uv pip install --system -e. --group=test-pyodide pyodide-py

      - name: Determine Pyodide version
        id: pyodide-version
        run: |
          PYODIDE_VERSION=$(python -c "import pyodide; print(pyodide.__version__)")
          echo "Using Pyodide $PYODIDE_VERSION"
          echo "version=$PYODIDE_VERSION" >> $GITHUB_OUTPUT

      - name: Download Pyodide
        uses: pyodide/pyodide-actions/download-pyodide@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          version: ${{ steps.pyodide-version.outputs.version }}
          to: pyodide-dist

      # Chrome is deliberately not installed here: the runner image already
      # ships Chrome and a ChromeDriver built to match it. Installing another
      # copy is what broke this job -- Selenium Manager drives the image's
      # Chrome regardless, so any version the action fetches has to agree with
      # it, and neither "latest" (a Chromium dev snapshot) nor "stable" (a
      # major ahead while the image lags) does.
      - name: Install Firefox
        uses: pyodide/pyodide-actions/install-browser@012fa537869d343726d01863a34b773fc4d96a14 # v2
        with:
          runner: selenium
          browser: firefox
          browser-version: latest
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run pytest (Chrome)
        run: |
          pytest -vv -o asyncio_default_fixture_loop_scope=function --dist-dir=./pyodide-dist/ --runner=selenium --runtime=chrome tests-wasm

      - name: Run pytest (Firefox)
        run: |
          pytest -vv -o asyncio_default_fixture_loop_scope=function --dist-dir=./pyodide-dist/ --runner=selenium --runtime=firefox tests-wasm

  gpu-build:
    name: GPU test with CUDA ${{ matrix.cuda-version }}
    strategy:
      fail-fast: false
      matrix:
        cuda-version: [12, 13]

    runs-on: self-hosted
    timeout-minutes: 30

    # Required for miniconda to activate conda
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - name: Clean the workspace and mamba
        run: |
          rm -rf * .[!.]* || echo "Nothing to clean"
          rm -rf ~/micromamba* || echo "Nothing to clean"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get micromamba
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-name: test-env
          init-shell: bash
          # numba-cuda 0.30.4 does not support NumPy 2.5: it calls
          # overload(np.row_stack), removed in 2.5, while importing numba.cuda,
          # which Awkward's CUDA backend imports. numba 0.66 used to hold NumPy
          # back, but 0.67 relaxed its pin to <2.6. Drop this once numba-cuda
          # releases a fix.
          #
          # cccl-python >= 1.2 JIT-compiles the Python callables that Awkward's
          # CUDA backend passes to cuda.compute with numba-cuda-mlir, which the
          # conda package treats as optional, so it has to be requested here.
          #
          # numba-cuda (and with it numba) used to be a dependency of
          # cccl-python, but the conda-forge rebuild of cccl-python 1.2.0
          # (build number 1) dropped it, so it has to be requested here too.
          create-args: >-
            -c rapidsai
            python=3.13
            cuda-version=${{ matrix.cuda-version }}
            cuda-toolkit
            cuda-python
            cccl-python
            numba-cuda
            numba-cuda-mlir
            cupy
            kvikio
            nvcomp
            pytest-cov
            pytest-rerunfailures
            numpy<2.5

      - name: Pip install the package
        run: pip install --group=test-core .

      # The CPU tests run on the GitHub-hosted runners, which also measure their
      # coverage. CUDA 13 measures the coverage of the GPU code paths.
      - name: Run the GPU tests
        env:
          COVERAGE_ARGS: ${{ matrix.cuda-version == 13 && '--cov=uproot --cov-branch --cov-report=xml' || '' }}
        run: |
          python -m pytest -vv tests-cuda --reruns 10 --reruns-delay 30 --only-rerun "(?i)http|ssl|timeout|expired|connection|socket"\
                           $COVERAGE_ARGS

      - name: Upload coverage reports to Codecov
        if: matrix.cuda-version == 13
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  pass:
    name: Check required tests
    if: always()
    needs: [build, numpy1-build, pyodide-build]
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
